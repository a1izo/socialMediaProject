<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><rect width="1200" height="700" rx="18" fill="#1e1e2e"/><circle cx="40" cy="36" r="9" fill="#ff5f56"/><circle cx="70" cy="36" r="9" fill="#ffbd2e"/><circle cx="100" cy="36" r="9" fill="#27c93f"/><text font-family="Consolas, monospace" font-size="30"><tspan x="60" y="140" fill="#c792ea">public </tspan><tspan fill="#82aaff">async Task</tspan><tspan fill="#ffcb6b">&lt;PostDto&gt; </tspan><tspan fill="#eeffff">AddAsync(CreatePostDto dto)</tspan><tspan x="60" y="190" fill="#89ddff">{</tspan><tspan x="100" y="240" fill="#c792ea">var </tspan><tspan fill="#eeffff">post = </tspan><tspan fill="#c792ea">await </tspan><tspan fill="#eeffff">repo.AddAsync(dto.ToEntity());</tspan><tspan x="100" y="290" fill="#676e95">// the bread is in the oven, the build is green</tspan><tspan x="100" y="340" fill="#c792ea">return </tspan><tspan fill="#eeffff">post.ToDto();</tspan><tspan x="60" y="390" fill="#89ddff">}</tspan></text></svg>